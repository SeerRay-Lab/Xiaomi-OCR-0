end2end_eval:
  metrics:
    text_block:
      metric:
      - Edit_dist
    display_formula:
      metric:
      - Edit_dist
      - CDM
      # Keep each stage around 1/3 to 1/2 of idle CPUs to avoid deadlocks.
      cdm_workers: 16
    table:
      metric:
      - TEDS
      - Edit_dist
      # Keep each stage around 1/3 to 1/2 of idle CPUs to avoid deadlocks.
      teds_workers: 16
    reading_order:
      metric:
      - Edit_dist
  dataset:
    dataset_name: end2end_dataset
    ground_truth:
      data_path: ./demo_data/omnidocbench_demo/OmniDocBench_demo.json
    prediction:
      data_path: ./demo_data/end2end
    match_method: quick_match
    # Keep each stage around 1/3 to 1/2 of idle CPUs to avoid deadlocks.
    match_workers: 16
    # quick_match_truncated_timeout_sec: 300   # v1.6 default
    quick_match_truncated_timeout_sec: 1200
    # match_timeout_sec: 420                   # v1.6 default
    match_timeout_sec: 1200
    # timeout_fallback_max_chunk_span: 10      # v1.6 default
    timeout_fallback_max_chunk_span: 200
    # timeout_fallback_order_penalty: 0.10     # v1.6 default
    timeout_fallback_order_penalty: 0.05
